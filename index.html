<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>果宝特攻 · 水果机甲肉鸽</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    /* 移动端：禁止滚动/双指缩放/橡皮筋（触控目标与摇杆的默认手势交给 JS） */
    touch-action: none; overscroll-behavior: none;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    background: #150e2b;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 低血量红晕 ── */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 140px 50px rgba(255, 30, 60, 0.55);
    opacity: 0; transition: opacity .5s;
  }
  #vignette.low { opacity: 1; animation: pulseRed 1.1s infinite; }
  @keyframes pulseRed { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* ── HUD（DOM id 与 core.js 契约一致） ── */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  .hud-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: calc(12px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 12px calc(18px + env(safe-area-inset-left));
    gap: 12px;
  }
  .hud-left { display: flex; flex-direction: column; gap: 5px; width: 240px; max-width: 32vw; }
  .bar {
    position: relative; height: 16px; border-radius: 8px;
    background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.18);
    overflow: hidden;
  }
  .bar .bar-fill {
    height: 100%; border-radius: 8px;
    transition: width .18s ease-out;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.25) inset;
  }
  .bar.xp { height: 9px; }
  .bar.shield { height: 6px; }
  .bar .bar-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }
  .hud-weapon {
    margin-top: 2px; font-size: 12px; color: #ffd23f;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); line-height: 1.4;
    max-width: 230px;
  }
  #hud-weapons { display: block; font-size: 11px; color: #cfc6ff; letter-spacing: 2px; }
  .hud-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; }
  .stat { font-size: 13px; color: #cfc6ff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .stat b { color: #ffd23f; font-size: 16px; }
  .stat.time { font-size: 22px; font-weight: bold; color: #fff; font-variant-numeric: tabular-nums; }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
  .hidden { display: none !important; }

  /* ── Boss 血条（core 契约：#boss-bar 容器 / #boss-fill 填充 / #boss-name 名称） ── */
  #boss-bar {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 12; display: none; flex-direction: column; align-items: center; gap: 3px;
    width: min(420px, 62vw); pointer-events: none;
  }
  #boss-name {
    font-size: 15px; font-weight: 900; color: #ffd23f; letter-spacing: 4px;
    text-shadow: 0 1px 4px rgba(0,0,0,.95), 0 0 14px rgba(255, 90, 40, .8);
  }
  .boss-fill-wrap {
    width: 100%; height: 12px; border-radius: 7px; overflow: hidden;
    background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 210, 63, 0.55);
    box-shadow: 0 0 14px rgba(255, 120, 40, 0.35);
  }
  #boss-fill {
    height: 100%; width: 0%; border-radius: 7px;
    background: linear-gradient(90deg, #ff3040, #ff8a3c);
    box-shadow: 0 0 10px rgba(255, 80, 40, 0.8) inset;
    transition: width .15s ease-out;
  }

  /* Buff 图标 */
  #stat-buffs {
    position: fixed; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; z-index: 11; pointer-events: none;
  }
  .buff {
    display: flex; align-items: center; gap: 6px;
    background: rgba(10, 6, 24, 0.72); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .buff-icon { font-size: 16px; }
  .buff-bar { width: 42px; height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
  .buff-bar-fill { display: block; height: 100%; border-radius: 3px; }

  /* 连击 */
  #stat-combo {
    position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%);
    font-size: 34px; font-weight: 900; color: #ffd23f; z-index: 11; pointer-events: none;
    text-shadow: 0 2px 0 #b45309, 0 0 24px rgba(255, 160, 40, 0.8);
    font-style: italic;
  }
  #stat-combo.pop { animation: comboPop .3s ease-out; }
  @keyframes comboPop { 0% { transform: translateX(-50%) scale(1.5); } 100% { transform: translateX(-50%) scale(1); } }

  /* ── 波次横幅 ── */
  #banner {
    position: fixed; left: 50%; top: 16%; transform: translateX(-50%);
    text-align: center; z-index: 30; pointer-events: none;
    padding: 10px 34px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(255, 90, 40, 0.92), rgba(180, 40, 90, 0.92));
    border: 2px solid rgba(255, 220, 150, 0.8);
    box-shadow: 0 0 40px rgba(255, 100, 60, 0.55);
  }
  #banner-text { font-size: 30px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 2px 0 rgba(90, 10, 0, 0.6); }
  #banner-sub { font-size: 14px; opacity: .95; margin-top: 2px; }
  #banner.banner-in { animation: bannerIn .5s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes bannerIn { 0% { transform: translateX(-50%) scale(.4); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

  /* ── 全屏界面（id 与 core.js 契约一致：#start #upgrade #gameover） ── */
  .screen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 4, 20, 0.6);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  .panel {
    background: linear-gradient(170deg, rgba(46, 26, 88, 0.96), rgba(24, 12, 52, 0.96));
    border: 2px solid rgba(255, 210, 63, 0.4);
    border-radius: 24px;
    padding: 34px 44px;
    max-width: 92vw;
    max-height: 92vh; overflow-y: auto;
    text-align: center;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.6), 0 0 60px rgba(120, 60, 220, 0.25);
    animation: panelIn .35s cubic-bezier(.2, 1.2, .4, 1);
  }
  @keyframes panelIn { 0% { transform: scale(.8) translateY(20px); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .title-fruit { font-size: 46px; letter-spacing: 8px; animation: floaty 2.6s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1 {
    margin-top: 8px; font-size: 40px; letter-spacing: 3px;
    background: linear-gradient(180deg, #fff6c9, #ffd23f 55%, #ff8a3c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 rgba(120, 50, 0, 0.55));
  }
  .subtitle { margin-top: 6px; color: #cfc6ff; font-size: 15px; }
  .best { margin-top: 14px; font-size: 14px; color: #ffd23f; }
  .best b { font-size: 20px; }
  .controls {
    list-style: none; margin: 18px auto 0; text-align: left; display: inline-block;
    color: #e6e0ff; font-size: 14px; line-height: 2;
  }
  .controls .key {
    display: inline-block; min-width: 150px; margin-right: 8px; text-align: center;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25);
    border-bottom-width: 3px; border-radius: 8px; padding: 1px 8px;
    font-weight: bold; color: #ffd23f; font-size: 13px;
  }
  .touch-hint { display: none; }
  body.touch .touch-hint { display: list-item; }
  .hint { margin-top: 12px; font-size: 12px; color: #8f83c8; }

  .screen-title { font-size: 30px; letter-spacing: 2px; color: #ffd23f; text-shadow: 0 2px 0 rgba(90,50,0,.5); }
  .screen-sub { color: #cfc6ff; font-size: 14px; margin: 4px 0 18px; }

  /* 升级卡片（core.js 生成 .upgrade-card / .uc-icon / .uc-name / .uc-desc） */
  #upgrade-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .upgrade-card {
    width: 218px; padding: 18px 14px; cursor: pointer;
    border-radius: 18px; border: 3px solid #ffd23f;
    background: linear-gradient(170deg, rgba(40, 30, 80, 0.95), rgba(20, 12, 46, 0.95));
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    touch-action: manipulation;
  }
  .upgrade-card:hover {
    transform: translateY(-7px) scale(1.04);
    box-shadow: 0 14px 34px rgba(0,0,0,.55), 0 0 24px rgba(255, 210, 63, 0.45);
  }
  .uc-icon { font-size: 46px; line-height: 1.2; }
  .uc-name { font-size: 19px; font-weight: 900; margin-top: 6px; color: #ffd23f; }
  .uc-desc { font-size: 12.5px; color: #cfc6ff; margin-top: 6px; line-height: 1.55; min-height: 38px; }

  /* 按钮 */
  .btn {
    display: inline-block; margin-top: 22px; padding: 12px 34px;
    font-size: 18px; font-weight: 900; letter-spacing: 2px;
    color: #3b1f00; background: linear-gradient(180deg, #ffe9a8, #ffb347);
    border: none; border-radius: 14px; border-bottom: 6px solid #c77a1a;
    cursor: pointer; font-family: inherit;
    transition: transform .1s, border-bottom-width .1s, filter .15s;
    box-shadow: 0 6px 20px rgba(255, 150, 40, 0.35);
    touch-action: manipulation; min-height: 44px; min-width: 44px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(4px); border-bottom-width: 2px; }

  /* 结算面板（core.js 写 #gameover-score / #gameover-time / #gameover-kills） */
  .over-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin: 18px auto 0; max-width: 460px;
  }
  .os {
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px; padding: 12px 10px;
  }
  .os span { display: block; font-size: 12px; color: #8f83c8; }
  .os b { font-size: 22px; color: #ffd23f; word-break: break-all; }

  /* ════════════ 移动端触控 UI（t7） ════════════ */

  /* 虚拟摇杆：随左半屏触摸点出现，pointer-events:none 不拦截事件，由 document 级 touch 处理 */
  #joy {
    display: none; position: fixed; z-index: 40;
    width: 132px; height: 132px; margin: -66px 0 0 -66px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border: 2px solid rgba(255,255,255,.4);
    box-shadow: 0 0 24px rgba(0,0,0,.35) inset;
    pointer-events: none;
  }
  #joy-knob {
    position: absolute; left: 50%; top: 50%;
    width: 58px; height: 58px; margin: -29px 0 0 -29px;   /* ≥44px 触控目标 */
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd27a, #ff8a1e 60%, #e04f00);
    border: 2px solid rgba(255,255,255,.65);
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    will-change: transform;
    pointer-events: none;
  }

  /* 武器切换按钮组（仅触屏设备显示，body.touch 控制） */
  #weapon-pad {
    position: fixed;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(18px + env(safe-area-inset-bottom));
    display: none; flex-direction: column; gap: 12px; z-index: 40;
  }
  body.touch #weapon-pad.show { display: flex; }
  .weapon-btn {
    position: relative;
    width: 62px; height: 62px;               /* ≥44px 触控目标 */
    border-radius: 18px;
    border: 2px solid rgba(255,255,255,.35);
    background: linear-gradient(170deg, rgba(40,30,80,.9), rgba(20,12,46,.9));
    font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
    transition: transform .12s, border-color .12s, box-shadow .12s, opacity .2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .weapon-btn:active { transform: scale(.88); }
  .weapon-btn.on {
    border-color: #ffd23f;
    box-shadow: 0 0 18px rgba(255,210,63,.65);
    background: linear-gradient(170deg, rgba(90,64,16,.95), rgba(60,40,8,.95));
  }
  .weapon-btn .w-num {
    position: absolute; top: 2px; right: 6px;
    font-size: 11px; font-weight: 900; color: #ffd23f;
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  @media (max-width: 640px) {
    h1 { font-size: 28px; }
    .panel { padding: 24px 18px; }
    .upgrade-card { width: 150px; padding: 12px 10px; }
    .uc-icon { font-size: 34px; }
    #stat-combo { font-size: 24px; }
    .hud-top { padding: 8px 10px; }
    .hud-left { width: 150px; }
    .bar { height: 13px; }
    .bar.xp { height: 8px; }
    .stat.time { font-size: 18px; }
    .weapon-btn { width: 56px; height: 56px; font-size: 26px; }
    #joy { width: 116px; height: 116px; margin: -58px 0 0 -58px; }
    #joy-knob { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
  }
</style>
</head>
<body>
  <!-- 低血量红晕 -->
  <div id="vignette"></div>

  <!-- 游戏画布 -->
  <canvas id="game"></canvas>

  <!-- HUD（id 与 core.js 契约一致；core 通过 style.display 控制显隐） -->
  <div id="hud">
    <div class="hud-top">
      <div class="hud-left">
        <div class="bar hp"><div class="bar-fill" id="hud-hp-fill"></div><span class="bar-text" id="hud-hp-text">HP 100/100</span></div>
        <div class="bar shield hidden" id="hud-shield-row"><div class="bar-fill" id="hud-shield-fill"></div></div>
        <div class="bar xp"><div class="bar-fill" id="hud-xp-fill"></div><span class="bar-text" id="hud-xp-text">0/10</span></div>
        <div class="hud-weapon"><span id="hud-weapon">💥 能量弹</span><span id="hud-weapons"></span></div>
      </div>
      <div class="hud-mid">
        <div class="stat">第 <b id="hud-wave">1</b> 波</div>
        <div class="stat time" id="hud-time">00:00</div>
      </div>
      <div class="hud-right">
        <div class="stat">击杀 <b id="hud-kills">0</b></div>
        <div class="stat">Lv.<b id="hud-level">1</b></div>
        <div class="stat">得分 <b id="hud-score">0</b></div>
      </div>
    </div>
  </div>
  <div id="stat-buffs"></div>
  <div id="stat-combo" class="hidden"></div>

  <!-- Boss 血条（core 控制显隐与宽度；缺失静默跳过） -->
  <div id="boss-bar">
    <span id="boss-name">BOSS</span>
    <div class="boss-fill-wrap"><div id="boss-fill"></div></div>
  </div>

  <!-- 波次横幅 -->
  <div id="banner" class="hidden">
    <div id="banner-text"></div>
    <div id="banner-sub"></div>
  </div>

  <!-- 虚拟摇杆（左半屏拖拽，touch 设备动态出现） -->
  <div id="joy"><div id="joy-knob"></div></div>

  <!-- 触控武器切换按钮（右下方，仅 touch 设备） -->
  <div id="weapon-pad"></div>

  <!-- 开始界面（core.js wireUI 绑定 #start-btn） -->
  <div id="start" class="screen">
    <div class="panel">
      <div class="title-fruit">🍊🍍🍎</div>
      <h1>果宝特攻 · 机甲肉鸽</h1>
      <p class="subtitle">水果机甲觉醒，迎战暗黑果实军团！</p>
      <div class="best">最佳纪录：第 <b id="start-best">1</b> 波</div>
      <ul class="controls">
        <li><span class="key">WASD / 方向键</span>移动</li>
        <li><span class="key">自动射击</span>无需操作，瞄准最近敌人</li>
        <li><span class="key">1 - 4 数字键</span>切换武器（已解锁）</li>
        <li><span class="key">Enter / 空格</span>开始 · 重开</li>
        <li class="touch-hint"><span class="key">📱 触屏</span>左半屏拖动摇杆 · 右下按钮切武器</li>
      </ul>
      <button id="start-btn" class="btn">开始游戏 🚀</button>
      <p class="hint">升级时三选一强化 · 活得更久，冲得更远！</p>
    </div>
  </div>

  <!-- 升级选择界面（core.js 动态生成 .upgrade-card） -->
  <div id="upgrade" class="screen" style="display:none">
    <div class="panel">
      <h2 class="screen-title">⬆️ 升级！选择强化</h2>
      <p class="screen-sub">机甲获得新能力，三选一</p>
      <div id="upgrade-cards"></div>
    </div>
  </div>

  <!-- 结束界面（core.js 写 #gameover-score / #gameover-time / #gameover-kills，绑定 #restart-btn） -->
  <div id="gameover" class="screen" style="display:none">
    <div class="panel">
      <h2 class="screen-title">💥 机甲报废</h2>
      <div class="over-stats">
        <div class="os"><span>得分</span><b id="gameover-score">0</b></div>
        <div class="os"><span>存活时间</span><b id="gameover-time">0 秒</b></div>
        <div class="os"><span>击杀数</span><b id="gameover-kills">0</b></div>
      </div>
      <button id="restart-btn" class="btn">再战一局 🔁</button>
    </div>
  </div>

  <script src="art.js"></script>
  <script src="rogue.js"></script>
  <script src="core.js"></script>
  <script>
    (function () {
      'use strict';
      function ready(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
      }
      ready(function () {
        var V = window.FruitGame && window.FruitGame.Visuals;
        if (!V) return;
        var C = window.FruitGame && window.FruitGame.Core;
        var best = 1;
        try { best = parseInt(localStorage.getItem('fruit-rogue.bestWave'), 10) || 1; } catch (e) {}
        V.init(document.getElementById('game'));
        V.showStartScreen({ best: best });
        if (C && typeof C.init === 'function') {
          // 正式流程：core 接管主循环 / 开始按钮 / HUD / 结算
          C.init(document.getElementById('game'));
          setupTouch(C);   // t7：移动端触控（摇杆 + 武器按钮）
        } else {
          // 兜底：core 未加载时，开始按钮进入美术演示模式
          V.showScreen('start');
          var sb = document.getElementById('start-btn');
          if (sb) sb.addEventListener('click', function () {
            V.showScreen('hud');
            V.preview();
          });
        }
      });

      /* ════════════ t7 移动端触控（index.html 内联，契约见下） ════════════
       * 依赖 core 接口（core-dev t6 实现）：
       *   FruitGame.Core.setTouchMove(dx, dy)  —— dx/dy ∈ [-1,1] 归一化移动向量
       *   FruitGame.Core.setWeapon(n)          —— n 为武器索引（0-3，同数字键 1-4）
       * 降级：setTouchMove 缺失 → 摇杆隐藏（console.warn）；
       *       setWeapon 缺失但 switchWeapon(index) 存在 → 走 switchWeapon；
       *       两者皆缺 → 武器按钮隐藏。
       * 桌面键盘（core 的 keydown 处理）不受影响；触控 UI 仅 touch 设备显示。
       */
      function setupTouch(C) {
        // 触屏检测：ontouchstart+maxTouchPoints，或主指针为粗指针（coarse）；
        // 不用 any-pointer（headless/混合设备会误报）也不裸用 maxTouchPoints（headless 虚报 256）
        var isTouch = (('ontouchstart' in window) && navigator.maxTouchPoints > 0) ||
          (typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches);
        if (!isTouch) return;                       // 桌面保持纯键盘

        document.body.classList.add('touch');

        var joy = document.getElementById('joy');
        var knob = document.getElementById('joy-knob');
        var pad = document.getElementById('weapon-pad');

        var canMove = C && typeof C.setTouchMove === 'function';
        var canSwitch = C && (typeof C.setWeapon === 'function' || typeof C.switchWeapon === 'function');
        if (!canMove) {
          if (joy) joy.style.display = 'none';
          console.warn('[touch] FruitGame.Core.setTouchMove 缺失，虚拟摇杆已隐藏（等待 core 实现）');
        }
        var canSwitch = C && (typeof C.setWeapon === 'function' || typeof C.switchWeapon === 'function');
        if (!canSwitch && pad) {
          pad.style.display = 'none';
          console.warn('[touch] FruitGame.Core.setWeapon/switchWeapon 缺失，武器按钮已隐藏（等待 core 实现）');
        }

        /* ── 虚拟摇杆：左半屏任意点按下即出现，拖拽控制，rAF 节流输出 ── */
        var JOY_RADIUS = 60;        // 摇杆最大偏移半径（逻辑 px）
        var DEAD_ZONE = 0.14;       // 死区：小于该幅度视为归零（防漂移）
        var joyId = null;           // 当前摇杆触点 identifier
        var joyOx = 0, joyOy = 0;   // 摇杆原点（触摸起点）
        var pending = null;         // 待输出向量 {x,y}
        var flushRaf = 0;

        function queueMove(x, y) {
          if (!canMove) return;
          pending = { x: x, y: y };
          if (!flushRaf) flushRaf = requestAnimationFrame(function () {
            flushRaf = 0;
            if (pending && C && typeof C.setTouchMove === 'function') {
              C.setTouchMove(pending.x, pending.y);
            }
            pending = null;
          });
        }
        function showJoy(x, y) {
          if (!joy || !knob) return;
          joy.style.display = 'block';
          joy.style.left = x + 'px';
          joy.style.top = y + 'px';
          knob.style.transform = 'translate(0px, 0px)';
        }
        function hideJoy() {
          if (joy) joy.style.display = 'none';
        }
        function isUiTarget(node) {
          return node && node.closest && node.closest('button, .screen, #hud, #stat-buffs, #stat-combo, .weapon-btn, [data-ui]');
        }
        function onTs(e) {
          // 仅游玩中、左半屏、非 UI 控件 → 生成摇杆
          if (!C || C.state !== 'playing' || joyId !== null) return;
          var t = e.changedTouches && e.changedTouches[0];
          if (!t) return;
          if (t.clientX > window.innerWidth * 0.5) return;
          if (isUiTarget(e.target)) return;
          joyId = t.identifier;
          joyOx = t.clientX; joyOy = t.clientY;
          showJoy(joyOx, joyOy);
          queueMove(0, 0);
          if (e.cancelable) e.preventDefault();
        }
        function onTm(e) {
          if (joyId === null) return;
          var t = null;
          var i, changed = e.changedTouches || [];
          for (i = 0; i < changed.length; i++) {
            if (changed[i].identifier === joyId) { t = changed[i]; break; }
          }
          if (!t) return;
          var dx = (t.clientX - joyOx) / JOY_RADIUS;
          var dy = (t.clientY - joyOy) / JOY_RADIUS;
          var len = Math.sqrt(dx * dx + dy * dy);
          if (len > 1) { dx /= len; dy /= len; len = 1; }
          var outX = 0, outY = 0;
          if (len > DEAD_ZONE) { outX = dx; outY = dy; }
          if (knob) {
            knob.style.transform = 'translate(' + (dx * JOY_RADIUS * 0.62) + 'px,' + (dy * JOY_RADIUS * 0.62) + 'px)';
          }
          queueMove(outX, outY);
          if (e.cancelable) e.preventDefault();
        }
        function onTe(e) {
          if (joyId === null) return;
          var changed = e.changedTouches || [], i;
          for (i = 0; i < changed.length; i++) {
            if (changed[i].identifier === joyId) {
              joyId = null;
              hideJoy();
              queueMove(0, 0);
              break;
            }
          }
        }
        if (canMove) {
          document.addEventListener('touchstart', onTs, { passive: false });
          document.addEventListener('touchmove', onTm, { passive: false });
          document.addEventListener('touchend', onTe, { passive: true });
          document.addEventListener('touchcancel', onTe, { passive: true });
        }

        /* ── 触控武器切换按钮：右下角竖排，只显示已解锁，高亮当前 ── */
        var WEAPON_ORDER = ['blaster', 'boomerang', 'pineapple', 'orange'];
        var WEAPON_META = {
          blaster:   { icon: '💥', name: '能量弹' },
          boomerang: { icon: '🍉', name: '西瓜回旋镖' },
          pineapple: { icon: '🍍', name: '菠萝榴弹' },
          orange:    { icon: '🍊', name: '橙子连射' }
        };
        var lastSig = '';
        function buildPad() {
          if (!pad || !canSwitch) return;
          var unlocked = (C && C.weapons) || [];
          pad.innerHTML = '';
          for (var i = 0; i < WEAPON_ORDER.length; i++) {
            var id = WEAPON_ORDER[i];
            if (unlocked.indexOf(id) === -1) continue;
            (function (wid, idx) {
              var meta = WEAPON_META[wid] || { icon: '❓', name: wid };
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'weapon-btn';
              b.setAttribute('data-w', wid);
              b.setAttribute('data-n', idx + 1);
              b.setAttribute('aria-label', '武器 ' + meta.name);
              b.innerHTML = '<span>' + meta.icon + '</span><span class="w-num">' + (idx + 1) + '</span>';
              b.addEventListener('click', function () {
                if (!C) return;
                // 契约：setWeapon(n) 的 n=1-4（同数字键 1-4），已解锁才生效
                if (typeof C.setWeapon === 'function') C.setWeapon(idx + 1);
                else if (typeof C.switchWeapon === 'function') C.switchWeapon(idx); // 降级（0 基）
              });
              pad.appendChild(b);
            })(id, i);
          }
        }
        function refreshPad() {
          if (!pad) return;
          var playing = C && C.state === 'playing';
          pad.classList.toggle('show', !!playing);
          if (!playing) return;
          var sig = ((C && C.weapons) || []).join(',');
          if (sig !== lastSig) { lastSig = sig; buildPad(); }
          var cur = C && C.weapon;
          var btns = pad.children;
          for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('on', btns[i].getAttribute('data-w') === cur);
          }
        }
        if (canSwitch) {
          buildPad();
          setInterval(refreshPad, 400);   // 轮询：解锁/切换/状态变化（低频，性能友好）
        }
      }
    })();
  </script>
</body>
</html>
